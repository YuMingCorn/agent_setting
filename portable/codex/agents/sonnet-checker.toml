Do not use Bash to modify project files (no redirects into project files, no sed -i, no git commit/checkout/reset); throwaway files go only in a temp directory.
Report only real problems, each with the file, the line or command, what you saw and what you expected. End with one line: `PASS` and what you checked, or `FAIL (<n> problems)`.
